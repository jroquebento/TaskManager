services:

  sqlserver:

    image: mcr.microsoft.com/mssql/server:2025-latest

    container_name: taskmanager-sqlserver

    environment:

      ACCEPT_EULA: "Y"

      MSSQL_SA_PASSWORD: "TaskManager@123"

    ports:

      - "1433:1433"

    volumes:

      - sqlserver_data:/var/opt/mssql

    healthcheck:

      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TaskManager@123' -C -Q 'SELECT 1' || exit 1"]

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 30s

  api:

    build:

      context: .

      dockerfile: Dockerfile

    container_name: taskmanager-api

    environment:

      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=TaskManagerDb;User Id=sa;Password=TaskManager@123;TrustServerCertificate=True;"

    ports:

      - "8080:8080"

    depends_on:

      sqlserver:

        condition: service_healthy

volumes:

  sqlserver_data: